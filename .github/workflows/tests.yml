name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      mutation:
        description: "Ejecutar también los tests de mutación (lento)"
        type: boolean
        default: false

jobs:
  tests:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check src tests scripts packaging
          uv run ruff format --check src tests scripts packaging

      - name: Unit, UI, integration and packaging tests
        run: uv run pytest --cov -o faulthandler_timeout=120

      - name: Smoke test
        run: uv run python scripts/smoke_test.py

  mutation:
    name: Tests de mutación
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run mutmut
        run: |
          uv run mutmut run
          uv run mutmut results
